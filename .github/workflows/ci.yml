name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # Minimum-privilege: this is a read-only check job, no write needed.
    # Explicitly denying everything else means a compromised dep can't
    # mint an OIDC token, write packages, or modify PR state.
    permissions:
      contents: read
      id-token: none
      actions: none
      checks: none
      deployments: none
      packages: none
      pull-requests: none
      statuses: none
    steps:
      # Pinned to immutable commit SHA so a moved tag can't redirect us
      # at a malicious action commit.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test
      - name: Verify no secrets in source
        run: |
          # Defense-in-depth — block any commit that introduces obvious
          # secret patterns even if .gitignore + .env.example are right.
          # Pattern stored base64-encoded so the literal name strings
          # don't appear in source (defeats casual grep of the public repo).
          NAME_PATTERN=$(echo 'YnJhZGxleXxsdWJldGtpbnxicmFkbGV5bHViZXRraW58dGhlbWVtZWJhbmtlcg==' | base64 -d)
          ! grep -rinE "$NAME_PATTERN" \
              --include='*.ts' --include='*.js' --include='*.json' \
              --include='*.md' --include='*.yml' \
              src/ api/ docs/ 2>/dev/null || \
              (echo 'leak detected'; exit 1)
          ! grep -rE '(api[_-]?key|private[_-]?key|secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9]{16,}' \
              --include='*.ts' --include='*.js' --include='*.json' \
              src/ api/ 2>/dev/null || \
              (echo 'hardcoded secret detected'; exit 1)
          echo 'no leaks found'
