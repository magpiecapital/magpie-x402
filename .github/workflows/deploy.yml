name: Deploy to Vercel

on:
  push:
    branches: [main]
  # Lets the operator re-trigger a deploy without pushing — useful
  # after a manual env-var change on Vercel that needs to take effect
  # on the deployed bundle.
  workflow_dispatch:

# Only one in-flight deploy at a time. If two pushes land back-to-back,
# the second cancels the first so we don't waste minutes on a deploy
# that's already superseded.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The CI workflow gates merges; if CI is red we don't deploy.
    # Skip the gate via workflow_dispatch when you need to override.
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt artifact
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
