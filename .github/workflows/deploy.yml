name: Deploy to Vercel

on:
  # AUTO-DEPLOY ON PUSH DISABLED 2026-06-27. The Vercel GitHub integration
  # already deploys this repo on push (its "Vercel — Deployment has completed"
  # check passes), making this workflow redundant — and its VERCEL_PROJECT_ID
  # repo secret is stale, so `vercel pull` failed on EVERY push and emailed a
  # failure each time. To re-enable: update the VERCEL_ORG_ID / VERCEL_PROJECT_ID
  # / VERCEL_TOKEN repo secrets to the current Vercel project, then uncomment the
  # push trigger below.
  # push:
  #   branches: [main]
  # Manual re-trigger (also needs the VERCEL_* secrets fixed to actually succeed).
  workflow_dispatch:

# Only one in-flight deploy at a time. If two pushes land back-to-back,
# the second cancels the first so we don't waste minutes on a deploy
# that's already superseded.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Minimum-privilege permissions block. All other defaults (issues,
    # pull-requests, packages, etc.) collapse to `none` once we declare
    # any explicit permissions — only what's listed here is granted.
    permissions:
      contents: read
      id-token: none
      actions: none
      checks: none
      deployments: none
      packages: none
      pull-requests: none
      statuses: none
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Actions pinned to full commit SHAs, not tags. Tags are mutable —
      # a compromised maintainer could move actions/checkout@v4 to point
      # at a malicious commit and our deploy starts exfiltrating secrets.
      # SHAs are immutable. The `# v4.2.2` comment is for human review;
      # the SHA is what GitHub Actions actually fetches.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'
      # Vercel CLI pinned to a tested version. Bumping requires editing
      # this file (visible diff) — supply-chain attack via `@latest`
      # auto-upgrade is impossible.
      - name: Install Vercel CLI
        run: npm install --global vercel@54.11.1
      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt artifact
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
